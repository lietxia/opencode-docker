services:
  opencode:
    build: .
    container_name: opencode-web
    restart: unless-stopped
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - exec opencode web --hostname 0.0.0.0 --port 4096
    ports:
      - "18080:4096"
    volumes:
      - ./workspace/:/workspace/
      - ./home:/root/