name: opencode
services:
  opencode:
    image: ${OPENCODE_IMAGE:-lietxia/opencode:latest}
    # build: .
    container_name: opencode-webui
    # v2 用 serve，不再是 web；监听地址/端口用参数传，v1 的 OPENCODE_HOSTNAME/OPENCODE_PORT 已不生效
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    ports:
      - "4096:4096"
      - "9999:9999"
    environment:
      # 固定密码：改成自己的；用户名固定为 opencode
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:-lede}
    volumes:
      - ./code:/code
      - ./config:/root/.config
      - ./data:/root/.local/share/opencode
      # v2 新增：service/运行状态目录
      - ./state:/root/.local/state/opencode
      - ./cache:/root/.cache/opencode
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:4096/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
