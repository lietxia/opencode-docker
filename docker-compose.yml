name: opencode
services:
  opencode:
    image: lietxia/opencode:latest
    # build: .
    container_name: opencode-webui
    ports:
      - 4096:4096
      - 9999:9999
      - 8888:8888
    environment:
      OPENCODE_SERVER_USERNAME: ubuntu
      OPENCODE_SERVER_PASSWORD: ubuntu
      OPENCODE_PORT: 4096
      OPENCODE_HOSTNAME: 0.0.0.0
    volumes:
      - ./workspace/:/workspace/
      - ./opencode_config/:/root/.config/opencode/
    restart: unless-stopped